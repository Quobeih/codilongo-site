<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodiLongo</title>
<meta name="description" content="CodiLongo: learn to code with short lessons, quizzes, and real code you can run offline.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #F8FAFC; --text: #101827; --muted: #475569; --accent: #15803D; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101827; --text: #F8FAFC; --muted: #94A3B8; --accent: #4ADE80; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px 64px; text-align: center; }
  img { width: 160px; height: 160px; border-radius: 32px; }
  h1 { font-size: 2rem; margin: 16px 0 4px; }
  .tagline { color: var(--accent); font-weight: 600; margin-top: 0; }
  p { color: var(--muted); }
  a { color: var(--accent); }
  nav { margin-top: 32px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="CodiLongo logo">
  <h1>CodiLongo</h1>
  <p class="tagline">From Local Roots to Global Code.</p>
  <p>Learn to code with short lessons, quizzes, and real code you can run on your phone, even offline. Starting with Java, with more languages on the way.</p>
  <p>Coming soon on Google Play.</p>
  <nav>
    <a href="privacy-policy.html">Privacy Policy</a> ·
    <a href="mailto:rotsensuerte@gmail.com">Contact</a>
  </nav>
</main>
</body>
</html>
